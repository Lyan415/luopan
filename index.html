<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191310">
<title>後天八卦二十四山羅盤</title>
<style>
  :root{
    --text:#f2e9dc; --dim:#c3b39c; --accent:#e05a5f; --gold:#d8a94f;
    --glass:rgba(28,21,17,.72); --glass-2:rgba(58,44,34,.78); --glass-line:rgba(217,200,162,.28);
    --stage:#1b1512;
    --safe-b: env(safe-area-inset-bottom,0px);
    --safe-t: env(safe-area-inset-top,0px);
  }
  :root[data-stage="light"]{ --stage:#e8dfcc; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--stage);
    color:var(--text);overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;}
  body{position:fixed;inset:0;}

  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--stage);}

  #ui{position:absolute;inset:0;pointer-events:none;z-index:10;
    transition:opacity .2s;}
  #ui > *{pointer-events:auto;}
  body.ui-hidden #ui{opacity:0;pointer-events:none;}
  body.ui-hidden #ui > *{pointer-events:none;}

  .glass{background:var(--glass);border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;}

  /* 右上讀數 */
  #readout{position:absolute;top:calc(8px + var(--safe-t));right:8px;padding:6px 10px;
    font-size:11px;line-height:1.55;min-width:98px;text-align:right;}
  #readout b{font-size:15px;color:var(--gold);font-weight:800;letter-spacing:.5px;}
  #readout .lbl{color:var(--dim);}
  #readout .hd b{color:var(--accent);}
  #readout .ln b{color:#ff6b6b;}
  #readout div{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}

  /* 左上小工具鍵 */
  #topLeft{position:absolute;top:calc(8px + var(--safe-t));left:8px;display:flex;gap:6px;}
  .icobtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--glass-line);
    background:var(--glass);color:var(--text);font-size:15px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;padding:0;}
  .icobtn:active{background:var(--glass-2);}
  .icobtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* 顯示介面的小浮鈕（介面隱藏時） */
  #showUi{position:absolute;top:calc(8px + var(--safe-t));left:8px;z-index:20;display:none;
    opacity:.55;pointer-events:auto;}
  body.ui-hidden #showUi{display:flex;}

  /* 底部控制塢 */
  #dock{position:absolute;left:6px;right:6px;bottom:calc(6px + var(--safe-b));
    display:flex;flex-direction:column;gap:6px;}
  #panelWrap{display:flex;flex-direction:column;}
  .panel{display:none;flex-direction:column;gap:6px;padding:8px 9px;}
  .panel.active{display:flex;}
  .rowx{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .btn{background:var(--glass-2);border:1px solid var(--glass-line);color:var(--text);
    border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;touch-action:manipulation;
    line-height:1.1;white-space:nowrap;}
  .btn:active{background:var(--accent);}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.f{flex:1;text-align:center;}
  .btn.sm{padding:6px 7px;font-size:11px;}
  .seg{display:flex;gap:5px;width:100%;}
  .seg .btn{flex:1;text-align:center;}
  .dpad{display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,28px);gap:3px;flex:0 0 auto;}
  .dpad .btn{padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .note{font-size:10.5px;color:var(--dim);line-height:1.5;flex:1;min-width:120px;}
  input[type=number]{background:var(--glass-2);border:1px solid var(--glass-line);color:var(--text);
    border-radius:10px;padding:7px 8px;font-size:13px;width:78px;}
  input[type=file]{display:none;}
  .chip{background:var(--glass-2);border:1px solid var(--glass-line);color:var(--dim);
    border-radius:14px;padding:4px 10px;font-size:11px;font-weight:700;touch-action:manipulation;}
  .chip.on{background:#ff4d4d;border-color:#ff4d4d;color:#fff;}

  /* 頁籤列 */
  #tabs{display:flex;gap:4px;padding:5px;}
  #tabs button{flex:1;background:transparent;border:none;color:var(--dim);border-radius:10px;
    padding:6px 2px 5px;font-size:10px;font-weight:700;display:flex;flex-direction:column;
    align-items:center;gap:1px;touch-action:manipulation;}
  #tabs button .ic{font-size:16px;line-height:1.1;}
  #tabs button.on{background:var(--glass-2);color:var(--accent);}
  #tabs .savebtn{flex:0 0 46px;color:#fff;background:var(--accent);}
  #tabs .savebtn.on{background:var(--accent);color:#fff;}

  #toast{position:absolute;left:50%;bottom:calc(120px + var(--safe-b));transform:translateX(-50%) translateY(10px);
    background:rgba(18,13,10,.92);color:#fff;padding:8px 14px;border-radius:10px;font-size:12.5px;
    opacity:0;transition:.22s;pointer-events:none;z-index:40;max-width:84%;text-align:center;line-height:1.5;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <canvas id="stage"></canvas>

  <button class="icobtn" id="showUi" title="顯示操作介面">☰</button>

  <div id="ui">

    <div id="topLeft">
      <button class="icobtn" id="hideUiBtn" title="隱藏操作介面">👁️</button>
      <button class="icobtn" id="themeBtn" title="背景深淺">🌓</button>
    </div>

    <div id="readout" class="glass">
      <div class="cp"><span class="lbl">羅盤</span><b id="roCompass">0.0°</b></div>
      <div class="hd" id="roHeadingRow" style="display:none;"><span class="lbl">方位</span><b id="roHeading">--</b></div>
      <div class="ln" id="roLineRow" style="display:none;"><span class="lbl">紅線</span><b id="roLine">--</b></div>
    </div>

    <div id="dock">
      <div id="panelWrap">

        <div class="panel glass active" id="p-compass">
          <div class="rowx">
            <div class="dpad">
              <span></span><button class="btn" id="cUp">▲</button><span></span>
              <button class="btn" id="cLeft">◀</button>
              <button class="btn" id="cCenter">◎</button>
              <button class="btn" id="cRight">▶</button>
              <span></span><button class="btn" id="cDown">▼</button><span></span>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;">
              <div class="seg">
                <button class="btn" id="cZoomOut">－</button>
                <button class="btn" id="cZoomIn">＋</button>
                <button class="btn" id="cReset">重設</button>
              </div>
              <div class="seg">
                <button class="btn sm" id="cRotL">↺15</button>
                <button class="btn sm" id="cRotL1">↺1</button>
                <button class="btn sm" id="cRotR1">1↻</button>
                <button class="btn sm" id="cRotR">15↻</button>
              </div>
            </div>
          </div>
          <div class="rowx">
            <input type="number" id="degIn" inputmode="decimal" min="0" max="359.9" step="0.1" placeholder="度數">
            <button class="btn p f" id="degGo">轉到正上方</button>
          </div>
        </div>

        <div class="panel glass" id="p-bg">
          <div class="rowx">
            <button class="btn p f" id="bgUp">📤 上傳／更換底圖</button>
            <input type="file" id="bgFile" accept="image/*">
          </div>
          <div class="rowx">
            <div class="dpad">
              <span></span><button class="btn" id="bUp">▲</button><span></span>
              <button class="btn" id="bLeft">◀</button>
              <button class="btn" id="bCenter">◎</button>
              <button class="btn" id="bRight">▶</button>
              <span></span><button class="btn" id="bDown">▼</button><span></span>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;">
              <div class="seg">
                <button class="btn" id="bZoomOut">－</button>
                <button class="btn" id="bZoomIn">＋</button>
                <button class="btn" id="bReset">重設</button>
              </div>
              <div class="seg">
                <button class="btn sm" id="bRotL">↺15</button>
                <button class="btn sm" id="bRotL1">↺1</button>
                <button class="btn sm" id="bRotR1">1↻</button>
                <button class="btn sm" id="bRotR">15↻</button>
              </div>
            </div>
          </div>
          <div class="note">在此頁直接拖曳＝移動底圖，雙指＝縮放／旋轉；畫面所見範圍即為裁切輸出範圍。</div>
        </div>

        <div class="panel glass" id="p-heading">
          <div class="rowx">
            <button class="btn p f" id="sensorBtn">啟用方位感測</button>
            <button class="btn f" id="followBtn">自動跟隨：關</button>
          </div>
          <div class="rowx">
            <button class="btn f" id="applyHeading">將目前方位轉到正上方</button>
          </div>
          <div class="note">需裝置具備磁力感測器並允許「動作與方向」權限；部分內嵌瀏覽器無法取得資料，請改用 Safari／Chrome 開啟。</div>
        </div>

        <div class="panel glass" id="p-line">
          <div class="rowx">
            <button class="btn p" id="addLine">➕ 新增紅線</button>
            <button class="btn" id="delLine">🗑️ 刪除</button>
            <span class="rowx" id="lineChips" style="gap:4px;"></span>
          </div>
          <div class="seg">
            <button class="btn sm" id="lRotL">↺15</button>
            <button class="btn sm" id="lRotL1">↺1</button>
            <button class="btn sm" id="lRotR1">1↻</button>
            <button class="btn sm" id="lRotR">15↻</button>
          </div>
          <div class="note">選取紅線後，在畫面上拖曳即可自由旋轉指向。</div>
        </div>

      </div>

      <div id="tabs" class="glass">
        <button data-tab="compass" class="on"><span class="ic">☯</span>羅盤</button>
        <button data-tab="bg"><span class="ic">🖼️</span>底圖</button>
        <button data-tab="heading"><span class="ic">🧭</span>方位</button>
        <button data-tab="line"><span class="ic">📏</span>紅線</button>
        <button class="savebtn" id="saveBtn"><span class="ic">💾</span>存圖</button>
      </div>
    </div>

  </div>

  <div id="toast"></div>

<script>
(function(){
  "use strict";

  /* =============== 狀態 =============== */
  var S = {
    bg:      { img:null, natW:0, natH:0, x:0, y:0, scale:1, rot:0 },
    compass: { img:null, natW:1600, natH:1600, x:0, y:0, scale:1, rot:0 },
    lines: [],
    activeLine: null,
    mode: 'compass',
    heading: null,
    follow: false
  };
  var nextLineId = 1;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 3);
  var W = 0, H = 0;  /* CSS 邏輯尺寸 */

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function n360(v){ v = v % 360; if(v < 0) v += 360; return v; }
  function fmt(v){ return v.toFixed(1) + '°'; }

  var toastEl = document.getElementById('toast'), toastT = null;
  function toast(m){
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  /* =============== 尺寸 =============== */
  function resize(){
    W = Math.max(50, Math.round(window.innerWidth));
    H = Math.max(50, Math.round(window.innerHeight));
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    draw();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });

  /* =============== 繪製核心（可重複用於匯出） =============== */
  function stageColor(){
    return document.documentElement.getAttribute('data-stage') === 'light' ? '#e8dfcc' : '#1b1512';
  }

  function renderScene(c, w, h, dpr, withInfo){
    c.save();
    c.setTransform(dpr,0,0,dpr,0,0);
    c.fillStyle = stageColor();
    c.fillRect(0,0,w,h);
    var cx = w/2, cy = h/2;

    if(S.bg.img){
      var b = S.bg;
      var fit = Math.max(w/b.natW, h/b.natH) * b.scale;
      c.save();
      c.translate(cx + b.x, cy + b.y);
      c.rotate(b.rot * Math.PI/180);
      c.scale(fit, fit);
      c.drawImage(b.img, -b.natW/2, -b.natH/2, b.natW, b.natH);
      c.restore();
    }

    if(S.compass.img){
      var k = S.compass;
      var fitC = (Math.min(w,h) * 0.94) / k.natW * k.scale;
      c.save();
      c.translate(cx + k.x, cy + k.y);
      c.rotate(k.rot * Math.PI/180);
      c.scale(fitC, fitC);
      c.drawImage(k.img, -k.natW/2, -k.natH/2, k.natW, k.natH);
      c.restore();
    }

    var ax = cx + S.compass.x, ay = cy + S.compass.y;
    var R = Math.hypot(w,h);
    S.lines.forEach(function(L){
      var on = (L.id === S.activeLine);
      c.save();
      c.translate(ax, ay);
      c.rotate(L.angle * Math.PI/180);
      c.strokeStyle = '#ff0000';
      c.lineWidth = on ? 4 : 2.6;
      c.globalAlpha = on ? 1 : .85;
      c.beginPath(); c.moveTo(0,-R); c.lineTo(0,R); c.stroke();
      c.globalAlpha = 1;
      if(on){
        c.fillStyle = '#ff0000';
        c.beginPath(); c.arc(0, -Math.min(w,h)*0.44, 5.5, 0, Math.PI*2); c.fill();
      }
      c.restore();
    });

    if(withInfo) drawInfo(c, w, h);
    c.restore();
  }

  /* 匯出圖片上要保留的角度值（不含任何功能鍵） */
  function drawInfo(c, w, h){
    var lines = [];
    lines.push({ t:'羅盤 ' + fmt(S.compass.rot), col:'#ffd88a' });
    if(S.heading != null) lines.push({ t:'方位 ' + fmt(S.heading), col:'#ff9a9e' });
    S.lines.forEach(function(L, i){
      lines.push({ t:'紅線' + (i+1) + ' ' + fmt(L.angle), col:'#ff6b6b' });
    });

    var fs = clamp(Math.round(Math.min(w,h) * 0.035), 12, 22);
    var pad = Math.round(fs*0.55), lh = Math.round(fs*1.45);
    c.save();
    c.font = '700 ' + fs + 'px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
    c.textBaseline = 'top';
    var maxW = 0;
    lines.forEach(function(L){ maxW = Math.max(maxW, c.measureText(L.t).width); });
    var boxW = maxW + pad*2, boxH = lines.length*lh + pad*1.4;
    var bx = pad, by = pad;
    c.fillStyle = 'rgba(12,9,7,.62)';
    if(c.roundRect){ c.beginPath(); c.roundRect(bx, by, boxW, boxH, pad*0.8); c.fill(); }
    else c.fillRect(bx, by, boxW, boxH);
    lines.forEach(function(L, i){
      c.fillStyle = L.col;
      c.fillText(L.t, bx + pad, by + pad*0.7 + i*lh);
    });
    c.restore();
  }

  /* rAF 節流重繪 */
  var rafPending = false;
  function draw(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(function(){
      rafPending = false;
      if(W) renderScene(ctx, W, H, DPR, false);
    });
  }

  /* =============== 載入羅盤 SVG =============== */
  var cimg = new Image();
  cimg.onload = function(){
    S.compass.img = cimg;
    S.compass.natW = cimg.naturalWidth || 1600;
    S.compass.natH = cimg.naturalHeight || 1600;
    resize();
  };

  /* =============== 讀數列 =============== */
  function syncReadout(){
    document.getElementById('roCompass').textContent = fmt(S.compass.rot);
    var hr = document.getElementById('roHeadingRow');
    if(S.heading != null){ hr.style.display = 'flex'; document.getElementById('roHeading').textContent = fmt(S.heading); }
    else hr.style.display = 'none';
    var lr = document.getElementById('roLineRow');
    var L = S.lines.find(function(x){ return x.id === S.activeLine; });
    if(L){ lr.style.display = 'flex'; document.getElementById('roLine').textContent = fmt(L.angle); }
    else lr.style.display = 'none';
  }

  /* =============== 頁籤 =============== */
  var tabBtns = document.querySelectorAll('#tabs button[data-tab]');
  var modeOf = { compass:'compass', bg:'bg', heading:'none', line:'line' };
  function setTab(name){
    tabBtns.forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === name); });
    ['compass','bg','heading','line'].forEach(function(k){
      document.getElementById('p-' + k).classList.toggle('active', k === name);
    });
    S.mode = modeOf[name];
  }
  tabBtns.forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });

  /* 介面顯示／隱藏 */
  document.getElementById('hideUiBtn').addEventListener('click', function(){
    document.body.classList.add('ui-hidden');
  });
  document.getElementById('showUi').addEventListener('click', function(){
    document.body.classList.remove('ui-hidden');
  });
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-stage');
    if(cur === 'light') document.documentElement.removeAttribute('data-stage');
    else document.documentElement.setAttribute('data-stage','light');
    draw();
  });

  /* =============== 手勢 =============== */
  var pts = new Map(), lastP = null, dragLayer = null, gest = null;

  function pos(e){ var r = canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
  function firstPos(){ var it = pts.values().next(); return it.done ? null : it.value; }
  function pair(){ var ids = Array.from(pts.keys()); return [pts.get(ids[0]), pts.get(ids[1])]; }

  function pickLayer(){
    if(S.mode === 'line' && S.activeLine != null) return 'line';
    if(S.mode === 'bg' && S.bg.img) return 'bg';
    if(S.mode === 'compass') return 'compass';
    return null;
  }

  function beginPinch(){
    var p = pair(); if(!p[0] || !p[1]) return;
    var layer = null;
    if(S.mode === 'bg' && S.bg.img) layer = 'bg';
    else if(S.mode === 'compass' || S.mode === 'line') layer = 'compass';
    if(!layer){ gest = null; return; }
    gest = {
      layer: layer,
      d0: Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y),
      a0: Math.atan2(p[1].y-p[0].y, p[1].x-p[0].x) * 180/Math.PI,
      s0: S[layer].scale,
      r0: S[layer].rot
    };
  }

  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, pos(e));
    if(pts.size === 1){ dragLayer = pickLayer(); lastP = firstPos(); gest = null; }
    else if(pts.size === 2){ beginPinch(); lastP = null; }
  });

  canvas.addEventListener('pointermove', function(e){
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, pos(e));
    if(pts.size === 1) doDrag();
    else if(pts.size >= 2) doPinch();
  });

  function endPtr(e){
    pts.delete(e.pointerId);
    if(pts.size < 2){ gest = null; }
    if(pts.size === 1){
      /* 由雙指變單指：重置拖曳基準，避免畫面跳動 */
      dragLayer = pickLayer();
      lastP = firstPos();
    }
    if(pts.size === 0){ dragLayer = null; lastP = null; }
  }
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);

  function doDrag(){
    var p = firstPos(); if(!p) return;
    if(!lastP){ lastP = p; return; }
    var dx = p.x - lastP.x, dy = p.y - lastP.y;
    if(dragLayer === 'bg'){ S.bg.x += dx; S.bg.y += dy; draw(); }
    else if(dragLayer === 'compass'){ S.compass.x += dx; S.compass.y += dy; draw(); }
    else if(dragLayer === 'line'){
      var ax = W/2 + S.compass.x, ay = H/2 + S.compass.y;
      var vx = p.x - ax, vy = p.y - ay;
      if(Math.hypot(vx,vy) > 8){
        var L = S.lines.find(function(x){ return x.id === S.activeLine; });
        if(L){ L.angle = n360(Math.atan2(vx, -vy) * 180/Math.PI); draw(); syncReadout(); }
      }
    }
    lastP = p;
  }

  function doPinch(){
    if(!gest) return;
    var p = pair(); if(!p[0] || !p[1]) return;
    var d = Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y);
    var a = Math.atan2(p[1].y-p[0].y, p[1].x-p[0].x) * 180/Math.PI;
    var o = S[gest.layer];
    o.scale = clamp(gest.s0 * (d / (gest.d0 || 1)), 0.15, 10);
    o.rot = n360(gest.r0 + (a - gest.a0));
    draw();
    if(gest.layer === 'compass'){ S.follow = false; updFollowBtn(); syncReadout(); }
  }

  /* =============== 羅盤控制 =============== */
  var STEP = 10;
  function cScale(f){ S.compass.scale = clamp(S.compass.scale*f, 0.15, 10); draw(); }
  function cRot(d){ S.compass.rot = n360(S.compass.rot + d); S.follow = false; updFollowBtn(); draw(); syncReadout(); }
  function cMove(dx,dy){ S.compass.x += dx; S.compass.y += dy; draw(); }
  document.getElementById('cZoomIn').addEventListener('click', function(){ cScale(1.12); });
  document.getElementById('cZoomOut').addEventListener('click', function(){ cScale(1/1.12); });
  document.getElementById('cRotL').addEventListener('click', function(){ cRot(-15); });
  document.getElementById('cRotL1').addEventListener('click', function(){ cRot(-1); });
  document.getElementById('cRotR1').addEventListener('click', function(){ cRot(1); });
  document.getElementById('cRotR').addEventListener('click', function(){ cRot(15); });
  document.getElementById('cUp').addEventListener('click', function(){ cMove(0,-STEP); });
  document.getElementById('cDown').addEventListener('click', function(){ cMove(0,STEP); });
  document.getElementById('cLeft').addEventListener('click', function(){ cMove(-STEP,0); });
  document.getElementById('cRight').addEventListener('click', function(){ cMove(STEP,0); });
  document.getElementById('cCenter').addEventListener('click', function(){ S.compass.x=0; S.compass.y=0; draw(); });
  document.getElementById('cReset').addEventListener('click', function(){
    S.compass.x=0; S.compass.y=0; S.compass.scale=1; S.compass.rot=0;
    S.follow=false; updFollowBtn(); draw(); syncReadout();
  });

  /* 輸入度數 → 轉到正上方 */
  function aimDegree(d){ S.compass.rot = n360(180 - n360(d)); }
  document.getElementById('degGo').addEventListener('click', function(){
    var v = parseFloat(document.getElementById('degIn').value);
    if(isNaN(v)){ toast('請輸入有效度數（0–359.9）'); return; }
    aimDegree(v); S.follow = false; updFollowBtn(); draw(); syncReadout();
    toast(fmt(n360(v)) + ' 已轉到正上方');
  });

  /* =============== 底圖 =============== */
  var bgFile = document.getElementById('bgFile');
  document.getElementById('bgUp').addEventListener('click', function(){ bgFile.click(); });
  bgFile.addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(ev){
      var im = new Image();
      im.onload = function(){
        S.bg.img = im; S.bg.natW = im.naturalWidth; S.bg.natH = im.naturalHeight;
        S.bg.x=0; S.bg.y=0; S.bg.scale=1; S.bg.rot=0;
        setTab('bg'); draw(); toast('底圖已載入，可拖曳／雙指縮放旋轉');
      };
      im.onerror = function(){ toast('圖片載入失敗，請換一張試試'); };
      im.src = ev.target.result;
    };
    rd.onerror = function(){ toast('檔案讀取失敗'); };
    rd.readAsDataURL(f);
    bgFile.value = '';
  });
  function needBg(){ if(!S.bg.img){ toast('請先上傳底圖'); return false; } return true; }
  document.getElementById('bZoomIn').addEventListener('click', function(){ if(needBg()){ S.bg.scale=clamp(S.bg.scale*1.12,.15,10); draw(); } });
  document.getElementById('bZoomOut').addEventListener('click', function(){ if(needBg()){ S.bg.scale=clamp(S.bg.scale/1.12,.15,10); draw(); } });
  document.getElementById('bRotL').addEventListener('click', function(){ if(needBg()){ S.bg.rot=n360(S.bg.rot-15); draw(); } });
  document.getElementById('bRotL1').addEventListener('click', function(){ if(needBg()){ S.bg.rot=n360(S.bg.rot-1); draw(); } });
  document.getElementById('bRotR1').addEventListener('click', function(){ if(needBg()){ S.bg.rot=n360(S.bg.rot+1); draw(); } });
  document.getElementById('bRotR').addEventListener('click', function(){ if(needBg()){ S.bg.rot=n360(S.bg.rot+15); draw(); } });
  document.getElementById('bUp').addEventListener('click', function(){ if(needBg()){ S.bg.y-=STEP; draw(); } });
  document.getElementById('bDown').addEventListener('click', function(){ if(needBg()){ S.bg.y+=STEP; draw(); } });
  document.getElementById('bLeft').addEventListener('click', function(){ if(needBg()){ S.bg.x-=STEP; draw(); } });
  document.getElementById('bRight').addEventListener('click', function(){ if(needBg()){ S.bg.x+=STEP; draw(); } });
  document.getElementById('bCenter').addEventListener('click', function(){ if(needBg()){ S.bg.x=0; S.bg.y=0; draw(); } });
  document.getElementById('bReset').addEventListener('click', function(){
    if(needBg()){ S.bg.x=0; S.bg.y=0; S.bg.scale=1; S.bg.rot=0; draw(); }
  });

  /* =============== 方位感測 =============== */
  var sensorOn = false, gotAbs = false, gotAny = false;
  var sensorBtn = document.getElementById('sensorBtn');
  var followBtn = document.getElementById('followBtn');

  function updFollowBtn(){ followBtn.textContent = '自動跟隨：' + (S.follow ? '開' : '關'); followBtn.classList.toggle('p', S.follow); }

  function onAbs(e){ handleOri(e, true); }
  function onRel(e){ handleOri(e, false); }

  function handleOri(e, absolute){
    var h = null;
    if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
      h = e.webkitCompassHeading;
      gotAbs = true;
    } else if(e.alpha != null && (absolute || e.absolute === true)){
      var so = 0;
      if(screen.orientation && typeof screen.orientation.angle === 'number') so = screen.orientation.angle;
      else if(typeof window.orientation === 'number') so = window.orientation;
      h = n360(360 - e.alpha + so);
      gotAbs = true;
    } else if(e.alpha != null && !gotAbs){
      /* 只有相對方位可用時才退而求其次，避免覆蓋絕對方位 */
      var so2 = 0;
      if(screen.orientation && typeof screen.orientation.angle === 'number') so2 = screen.orientation.angle;
      h = n360(360 - e.alpha + so2);
    }
    if(h == null) return;
    gotAny = true;
    S.heading = h;
    syncReadout();
    if(S.follow){ aimDegree(h); draw(); }
  }

  function attachSensors(){
    sensorOn = true;
    if('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onAbs, true);
    window.addEventListener('deviceorientation', onRel, true);
    sensorBtn.textContent = '感測已啟用';
    sensorBtn.classList.remove('p');
    setTimeout(function(){
      if(!gotAny) toast('未偵測到方位資料，此裝置或瀏覽器環境可能不支援羅盤感測');
    }, 3000);
  }

  sensorBtn.addEventListener('click', function(){
    if(sensorOn){ toast('感測已啟用'); return; }
    if(typeof DeviceOrientationEvent === 'undefined'){ toast('此瀏覽器不支援方向感測'); return; }
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r === 'granted') attachSensors();
        else toast('未取得方向感測權限');
      }).catch(function(err){ toast('無法啟用：' + (err && err.message ? err.message : '未知錯誤')); });
    } else attachSensors();
  });

  followBtn.addEventListener('click', function(){
    if(!sensorOn){ toast('請先啟用方位感測'); return; }
    if(S.heading == null){ toast('尚無方位資料'); return; }
    S.follow = !S.follow; updFollowBtn();
    if(S.follow){ aimDegree(S.heading); draw(); syncReadout(); }
  });

  document.getElementById('applyHeading').addEventListener('click', function(){
    if(S.heading == null){ toast('尚無方位資料，請先啟用感測'); return; }
    aimDegree(S.heading); draw(); syncReadout();
    toast('已將 ' + fmt(S.heading) + ' 轉到正上方');
  });
  updFollowBtn();

  /* =============== 紅線 =============== */
  var chipsEl = document.getElementById('lineChips');
  function renderChips(){
    chipsEl.innerHTML = '';
    S.lines.forEach(function(L, i){
      var c = document.createElement('button');
      c.className = 'chip' + (L.id === S.activeLine ? ' on' : '');
      c.textContent = '線' + (i+1);
      c.addEventListener('click', function(){ S.activeLine = L.id; renderChips(); syncReadout(); draw(); });
      chipsEl.appendChild(c);
    });
  }
  document.getElementById('addLine').addEventListener('click', function(){
    if(S.lines.length >= 12){ toast('最多 12 條紅線'); return; }
    var id = nextLineId++;
    S.lines.push({ id:id, angle:0 });
    S.activeLine = id; setTab('line'); renderChips(); syncReadout(); draw();
  });
  document.getElementById('delLine').addEventListener('click', function(){
    if(S.activeLine == null){ toast('沒有可刪除的紅線'); return; }
    S.lines = S.lines.filter(function(L){ return L.id !== S.activeLine; });
    S.activeLine = S.lines.length ? S.lines[S.lines.length-1].id : null;
    renderChips(); syncReadout(); draw();
  });
  function lRot(d){
    var L = S.lines.find(function(x){ return x.id === S.activeLine; });
    if(!L){ toast('請先新增或選取紅線'); return; }
    L.angle = n360(L.angle + d); draw(); syncReadout();
  }
  document.getElementById('lRotL').addEventListener('click', function(){ lRot(-15); });
  document.getElementById('lRotL1').addEventListener('click', function(){ lRot(-1); });
  document.getElementById('lRotR1').addEventListener('click', function(){ lRot(1); });
  document.getElementById('lRotR').addEventListener('click', function(){ lRot(15); });

  /* =============== 存成圖片（不含功能鍵、保留角度值） =============== */
  var dlCap = null;
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(function(c){ dlCap = c; }).catch(function(){ dlCap = null; });
  }

  function exportBlob(cb){
    var ex = document.createElement('canvas');
    ex.width = canvas.width; ex.height = canvas.height;
    var exc = ex.getContext('2d');
    renderScene(exc, W, H, DPR, true);   /* withInfo = true：燒入角度值 */
    if(ex.toBlob) ex.toBlob(cb, 'image/png');
    else cb(null);
  }

  function stamp(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  document.getElementById('saveBtn').addEventListener('click', function(){
    exportBlob(function(blob){
      if(!blob){ toast('產生圖片失敗'); return; }
      var name = 'luopan_' + stamp() + '.png';

      if(dlCap){
        dlCap.save({ filename:name, data:blob })
          .then(function(r){ toast(r && r.status === 'delivered' ? '圖片已送出' : '圖片已儲存'); })
          .catch(function(err){ if(!err || err.code !== 'declined') toast('儲存失敗：' + ((err&&err.message)||'未知錯誤')); });
        return;
      }

      var file = null;
      try { file = new File([blob], name, { type:'image/png' }); } catch(e){ file = null; }
      if(file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
        navigator.share({ files:[file] })
          .then(function(){ toast('請於分享選單選擇「儲存影像」'); })
          .catch(function(){ fallbackDownload(blob, name); });
        return;
      }
      fallbackDownload(blob, name);
    });
  });

  function fallbackDownload(blob, name){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast('圖片已下載');
    }catch(e){
      toast('無法直接存檔，請改用手機截圖保存');
    }
  }

  /* =============== 初始 =============== */
  renderChips();
  syncReadout();
  resize();
  setTab('compass');

})();
</script>
</body>
</html>
